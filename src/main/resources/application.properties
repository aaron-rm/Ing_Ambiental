server.port=8081

spring.application.name=sistema-alerta-inundaciones

# Base de datos. No guarde la contrasena real en el repositorio:
# defina DB_PASSWORD en el entorno o en un archivo .env no versionado.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alerta_inundaciones}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.stat=WARN
logging.level.com.alerta.sistema_alerta_inundaciones=INFO

# ---------------------------------------------------------------------------
# Firebase Cloud Messaging (FCM)
# ---------------------------------------------------------------------------
# Backend: credenciales administrativas SOLO por variables de entorno.
# Opcion A: FIREBASE_CREDENTIALS_PATH apunta al JSON de la cuenta de servicio.
# Opcion B: FIREBASE_CREDENTIALS_JSON contiene el JSON o su Base64.
# Nunca suba ese JSON al repositorio ni lo sirva al navegador.
firebase.enabled=${FIREBASE_ENABLED:true}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}
firebase.project-id=${FIREBASE_PROJECT_ID:}

# Frontend: datos publicos de la app web de Firebase (no son secretos).
firebase.publica.api-key=${FIREBASE_API_KEY:}
firebase.publica.auth-domain=${FIREBASE_AUTH_DOMAIN:}
firebase.publica.project-id=${FIREBASE_PROJECT_ID:}
firebase.publica.messaging-sender-id=${FIREBASE_MESSAGING_SENDER_ID:}
firebase.publica.app-id=${FIREBASE_APP_ID:}
firebase.publica.vapid-key=${FIREBASE_VAPID_KEY:}

# ---------------------------------------------------------------------------
# Monitoreo automatico
# ---------------------------------------------------------------------------
alerta.monitoreo.habilitado=${ALERTA_MONITOREO_HABILITADO:true}
alerta.monitoreo.intervalo-ms=${ALERTA_MONITOREO_INTERVALO_MS:900000}
alerta.monitoreo.retraso-inicial-ms=${ALERTA_MONITOREO_RETRASO_INICIAL_MS:60000}
alerta.monitoreo.notificar-recuperacion=${ALERTA_NOTIFICAR_RECUPERACION:true}

# ---------------------------------------------------------------------------
# Reglas de riesgo
# ---------------------------------------------------------------------------
# Los umbrales de lluvia son PROVISIONALES/EXPERIMENTALES. No son oficiales:
# deben validarse con IMHPA/SINAPROC o con registros locales antes de usarlos
# para decisiones reales. Los umbrales de caudal vienen de GEOGloWS; si la API
# de periodos de retorno falla, se usan 15/30/60 m3/s como referencia.
alerta.riesgo.lluvia-umbral-vigilancia-mm=${ALERTA_LLUVIA_VIGILANCIA_MM:25}
alerta.riesgo.lluvia-umbral-alerta-mm=${ALERTA_LLUVIA_ALERTA_MM:50}
alerta.riesgo.lluvia-umbral-emergencia-mm=${ALERTA_LLUVIA_EMERGENCIA_MM:100}
alerta.riesgo.max-edad-pronostico-horas=${ALERTA_MAX_EDAD_PRONOSTICO_HORAS:24}
alerta.riesgo.max-edad-precipitacion-horas=${ALERTA_MAX_EDAD_PRECIPITACION_HORAS:6}

# Token para endpoints administrativos heredados (suscripciones y evaluacion manual).
# Si queda vacio, esos endpoints responden 403. Se retirara cuando la consola
# termine de migrar a JWT.
alerta.admin.token=${ALERTA_ADMIN_TOKEN:}

# ---------------------------------------------------------------------------
# Autenticacion y sesiones
# ---------------------------------------------------------------------------
# Secreto HMAC para firmar los JWT. Debe tener al menos 32 caracteres.
# Si queda vacio, se genera uno temporal y los tokens se invalidan al reiniciar.
alerta.jwt.secret=${ALERTA_JWT_SECRET:}
alerta.jwt.expiracion-horas=${ALERTA_JWT_EXPIRACION_HORAS:24}

# Cuenta administradora inicial. La contrasena solo vive en el entorno local.
# Si ALERTA_ADMIN_PASSWORD queda vacia, no se crea ni modifica la cuenta.
alerta.admin.identificador=${ALERTA_ADMIN_IDENTIFICADOR:admin}
alerta.admin.password=${ALERTA_ADMIN_PASSWORD:}

# Origenes o patrones permitidos para CORS, separados por coma. No se usa "*".
# Para la demo con tuneles temporales se puede agregar
# https://*.trycloudflare.com; en produccion use origenes exactos.
alerta.cors.origenes=${ALERTA_CORS_ORIGENES:http://localhost:3000,http://localhost:5173,http://localhost:8081,http://127.0.0.1:8081}

# Cliente HTTP de la consola de demostracion. Debe apuntar al backend real.
alerta.api.base-url=${ALERTA_API_BASE_URL:http://localhost:8081}

# La consola es un cliente opcional; se puede desactivar sin afectar al backend.
alerta.demo.consola.habilitada=${ALERTA_DEMO_CONSOLA_HABILITADA:true}

# Precipitacion: Open-Meteo es publica y no requiere clave para este uso.
clima.open-meteo.url=${OPEN_METEO_URL:https://api.open-meteo.com/v1/forecast}
clima.open-meteo.cache-minutos=${OPEN_METEO_CACHE_MINUTOS:15}

# Caudal: cache en memoria de GEOGloWS por endpoint + reachId. Si la API falla,
# se reutiliza la ultima respuesta cacheada (aunque haya expirado) para no dejar
# el panel sin datos. Un valor menor a 1 se trata como 1 minuto.
geoglows.cache-minutos=${GEOGLOWS_CACHE_MINUTOS:15}

# Catalogo cerrado de cuatro rios (upsert por reachId desde catalogo/rios.json).
alerta.demo.cargar-catalogo=${ALERTA_CARGAR_CATALOGO:true}
